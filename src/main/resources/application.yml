spring:
  application:
    name: totp-engine
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    properties:
      hibernate:
        cache:
          use_second_level_cache: false
          use_query_cache: false
        generate_statistics: true
  flyway:
    out-of-order: false
    validate-on-migrate: true
    locations: classpath:db/migration

management:
  server:
    port: ${MANAGEMENT_PORT:${server.port:8080}}
  security:
    user:
      name: ${ACTUATOR_USERNAME:actuator}
      password: ${ACTUATOR_PASSWORD:change-me}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
    metrics:
      enabled: true
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,metrics,prometheus,info
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

totp:
  time-step-seconds: 30
  skew-window: 1
  algorithm: SHA1
  issuer-name: EnterpriseIAM
  encryption:
    key-env-var: TOTP_ENCRYPTION_KEY
  cache:
    eager-preload: false
    preload-limit: 1000
  warmup:
    enabled: true
    iterations: 1000

resilience4j:
  circuitbreaker:
    instances:
      mfa-db:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 100ms
        slow-call-rate-threshold: 80
  timelimiter:
    instances:
      mfa-crypto:
        timeout-duration: 50ms

server:
  shutdown: graceful

spring.lifecycle.timeout-per-shutdown-phase: 20s
