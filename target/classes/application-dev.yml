spring:
  datasource:
    url: jdbc:h2:mem:totpdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
  h2:
    console:
      enabled: false

logging:
  level:
    com.enterprise.totp: DEBUG
    org.springframework.security: DEBUG
